<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Duplex Hunter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236ea8ff'/%3E%3Crect x='8' y='8' width='16' height='16' rx='3' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<style>
:root{
  --bg:#0b1020;
  --panel:#131c31cc;
  --border:rgba(255,255,255,.08);
  --text:#f4f7fb;
  --muted:#97a3b6;
  --accent:#6ea8ff;
  --accent2:#8b5cf6;
  --shadow:0 10px 35px rgba(0,0,0,.35);
  --warn:#fbbf24;
  --bad:#f87171;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,system-ui,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at top left,#182848 0%,transparent 30%),
    radial-gradient(circle at bottom right,#3b0764 0%,transparent 25%),
    var(--bg);
}

.dh{
  max-width:1400px;
  margin:auto;
  padding:2rem;
}

.dh-hero{
  min-height:90vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.dh-hero-icon{
  width:86px;
  height:86px;
  border-radius:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-size:34px;
  box-shadow:var(--shadow);
}

.dh-hero h1{
  margin:24px 0 10px;
  font-size:68px;
  font-weight:900;
  letter-spacing:-3px;
}

.dh-hero p{
  max-width:560px;
  color:var(--muted);
  line-height:1.7;
}

.dh-dropzone{
  margin-top:32px;
  padding:22px 34px;
  border-radius:24px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(18px);
  cursor:pointer;
  display:flex;
  gap:12px;
  align-items:center;
  transition:.25s ease;
  box-shadow:var(--shadow);
}

.dh-dropzone:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.09);
}

.dh-dropzone input{
  display:none;
}

.dh-topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
  flex-wrap:wrap;
  gap:16px;
}

.dh-wordmark{
  font-size:28px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:12px;
}

.dh-btn{
  border:none;
  color:white;
  cursor:pointer;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  padding:12px 18px;
  border-radius:16px;
  transition:.2s ease;
}

.dh-btn:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,.1);
}

.dh-snaps{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:22px;
}

.dh-snap{
  border:none;
  cursor:pointer;
  color:white;
  padding:10px 16px;
  border-radius:14px;
  background:rgba(255,255,255,.05);
}

.dh-snap.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.dh-stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
  margin-bottom:28px;
}

.dh-stat{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:24px;
  padding:24px;
  backdrop-filter:blur(18px);
  box-shadow:var(--shadow);
}

.dh-stat-n{
  font-size:44px;
  font-weight:900;
}

.dh-stat-l{
  color:var(--muted);
  margin-top:8px;
}

.dh-toolbar{
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:24px;
  position:sticky;
  top:10px;
  z-index:5;
}

.dh-search{
  position:relative;
  flex:1;
  min-width:260px;
}

.dh-search i{
  position:absolute;
  top:50%;
  left:16px;
  transform:translateY(-50%);
  opacity:.6;
}

.dh-search input{
  width:100%;
  height:54px;
  border:none;
  outline:none;
  border-radius:18px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  padding:0 18px 0 48px;
  color:white;
  font-size:14px;
}

.dh-seg{
  display:flex;
  gap:10px;
}

.dh-seg button{
  border:none;
  cursor:pointer;
  height:54px;
  border-radius:16px;
  padding:0 18px;
  color:white;
  background:rgba(255,255,255,.06);
}

.dh-seg button.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.dh-groups{
  display:flex;
  flex-direction:column;
  gap:16px;
}

.dh-group{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:26px;
  overflow:hidden;
  backdrop-filter:blur(18px);
  box-shadow:var(--shadow);
}

.dh-gh{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 22px;
  cursor:pointer;
}

.dh-gh-left{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
}

.dh-badge{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  padding:6px 12px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}

.dh-hash{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-family:monospace;
  color:#d2dcef;
}

.dh-size{
  flex-shrink:0;
  color:var(--muted);
  font-size:13px;
}

.dh-chev{
  transition:.25s ease;
}

.dh-chev.open{
  transform:rotate(180deg);
}

.dh-gfiles{
  max-height:0;
  overflow:hidden;
  transition:max-height .35s ease;
}

.dh-gfiles.open{
  max-height:5000px;
}

.dh-file{
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px 22px;
  border-top:1px solid rgba(255,255,255,.05);
}

.dh-file:hover{
  background:rgba(255,255,255,.03);
}

.dh-file-icon{
  width:42px;
  height:42px;
  border-radius:14px;
  background:rgba(255,255,255,.06);
  display:flex;
  align-items:center;
  justify-content:center;
}

.dh-file-info{
  flex:1;
  min-width:0;
}

.dh-file-name{
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.dh-file-path{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.dh-copy{
  border:none;
  width:40px;
  height:40px;
  border-radius:14px;
  color:white;
  cursor:pointer;
  background:rgba(255,255,255,.06);
}

.dh-footer{
  margin-top:24px;
  display:flex;
  justify-content:space-between;
  color:var(--muted);
}

.dh-pagination{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-top:28px;
}

.dh-page-btn{
  border:none;
  cursor:pointer;
  color:white;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  padding:12px 18px;
  border-radius:14px;
}

.dh-page-info{
  color:var(--muted);
}

.dh-empty{
  text-align:center;
  padding:6rem 2rem;
}

.dh-stat.clickable{
  cursor:pointer;
  transition:.2s ease;
}

.dh-stat.clickable:hover{
  transform:translateY(-2px);
  border-color:rgba(110,168,255,.4);
}

.dh-stat-n.warn{
  color:var(--warn);
}

.dh-stat-n.bad{
  color:var(--bad);
}

.dh-filter{
  height:54px;
  border-radius:16px;
  padding:0 16px;
  color:white;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  font-size:14px;
  cursor:pointer;
}

.dh-filter option{
  background:#131c31;
}

.dh-gh-main{
  display:flex;
  flex-direction:column;
  gap:6px;
  min-width:0;
}

.dh-summary{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:13px;
}

.dh-chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:600;
  background:rgba(255,255,255,.07);
  color:#d2dcef;
  white-space:nowrap;
}

.dh-chip.warn{
  background:rgba(251,191,36,.14);
  color:var(--warn);
}

.dh-chip.good{
  background:rgba(110,168,255,.15);
  color:var(--accent);
}

.dh-chip.bad{
  background:rgba(248,113,113,.15);
  color:var(--bad);
}

.dh-details{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:14px;
  padding:18px 22px;
  border-top:1px solid rgba(255,255,255,.05);
  background:rgba(0,0,0,.12);
}

.dh-sec{
  min-width:0;
}

.dh-sec h4{
  margin:0 0 8px;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--accent);
}

.dh-kv{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:4px 14px;
  font-size:13px;
}

.dh-kv dt{
  color:var(--muted);
  white-space:nowrap;
}

.dh-kv dd{
  margin:0;
  min-width:0;
  overflow-wrap:anywhere;
}

.dh-mono{
  font-family:monospace;
}

.dh-issues{
  margin:8px 0 0;
  padding-left:18px;
  color:var(--bad);
  font-size:13px;
  line-height:1.6;
}

.dh-issues.warn{
  color:var(--warn);
  margin-top:6px;
}

.dh-btn.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.dh-file-meta{
  margin-top:6px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.dh-hero-actions,
.dh-actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
}

.dh-hero-actions{
  margin-top:32px;
}

.dh-hero-actions .dh-dropzone{
  margin-top:0;
}

.dh-actions .dh-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:14px;
}

.dh-actions input{
  display:none;
}

.dh-status{
  margin-top:18px;
  min-height:1.4em;
  color:var(--muted);
  font-size:14px;
  white-space:pre-line;
}

.dh-status.bad{
  color:var(--bad);
}

.dh-results{
  width:100%;
  max-width:760px;
  margin-top:28px;
  display:flex;
  flex-direction:column;
  gap:12px;
  text-align:left;
}

.dh-result{
  display:flex;
  align-items:center;
  gap:16px;
  width:100%;
  padding:18px 22px;
  border-radius:20px;
  border:1px solid var(--border);
  background:var(--panel);
  backdrop-filter:blur(18px);
  color:var(--text);
  font:inherit;
  text-align:left;
  cursor:pointer;
  transition:.2s ease;
}

.dh-result:hover{
  transform:translateY(-2px);
  border-color:rgba(110,168,255,.4);
}

.dh-result-info{
  flex:1;
  min-width:0;
}

.dh-result-name{
  font-weight:800;
  font-family:monospace;
  font-size:16px;
}

.dh-result-paths{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.dh-label{
  --c:#6ea8ff;
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
  color:var(--c);
  background:color-mix(in srgb,var(--c) 16%,transparent);
  border:1px solid color-mix(in srgb,var(--c) 35%,transparent);
}

.dh-label::before{
  content:'';
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--c);
}

button.dh-label{
  cursor:pointer;
  font-family:inherit;
  opacity:.55;
  transition:.15s ease;
}

button.dh-label:hover{
  opacity:.85;
}

button.dh-label.on{
  opacity:1;
  background:color-mix(in srgb,var(--c) 30%,transparent);
}

.dh-labels{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px;
}

.dh-labels:empty{
  display:none;
}

.dh-notes{
  padding:18px 22px;
  border-top:1px solid rgba(255,255,255,.05);
  display:flex;
  flex-direction:column;
  gap:12px;
  cursor:default;
}

.dh-notes h4{
  margin:0;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--accent);
}

.dh-notes textarea,
.dh-modal input[type=text]{
  width:100%;
  border-radius:14px;
  padding:12px 14px;
  color:var(--text);
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  font:inherit;
  font-size:14px;
  outline:none;
}

.dh-notes textarea{
  min-height:76px;
  resize:vertical;
}

.dh-notes textarea:focus,
.dh-modal input[type=text]:focus{
  border-color:rgba(110,168,255,.5);
}

.dh-notes-actions{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:12px;
  color:var(--muted);
  font-size:13px;
}

.dh-link{
  border:none;
  background:none;
  padding:0;
  color:var(--accent);
  cursor:pointer;
  font:inherit;
}

.dh-comment{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.55;
  font-size:14px;
}

.dh-group.focus{
  border-color:var(--accent);
}

.dh-note-card{
  padding:18px 22px;
  display:flex;
  flex-direction:column;
  gap:10px;
  cursor:pointer;
  transition:.2s ease;
}

.dh-note-card:hover{
  background:rgba(255,255,255,.03);
}

.dh-note-head{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
  min-width:0;
}

.dh-modal{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:rgba(5,8,18,.7);
  backdrop-filter:blur(6px);
}

.dh-modal-box{
  width:100%;
  max-width:520px;
  max-height:90vh;
  overflow:auto;
  padding:24px;
  border-radius:24px;
  background:#131c31;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
}

.dh-modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.dh-modal-head h3{
  margin:0;
}

.dh-label-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.dh-modal input[type=color]{
  flex-shrink:0;
  width:40px;
  height:40px;
  padding:3px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.06);
  cursor:pointer;
}

.dh-label-form{
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid var(--border);
}

body.dh-dragging .dh-dropzone.upload{
  border-color:var(--accent);
  background:rgba(110,168,255,.15);
}

@media(max-width:768px){
  .dh-hero h1{
    font-size:46px;
  }

  .dh-toolbar{
    position:static;
  }

  .dh-stats{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .dh-stat{
    padding:16px;
    border-radius:18px;
  }

  .dh-stat-n{
    font-size:30px;
  }
}
</style>
</head>
<body>

<div class="dh">

<div id="hero" class="dh-hero">

  <div class="dh-hero-icon">
    <i class="ti ti-scan"></i>
  </div>

  <h1>Duplex Hunter</h1>

  <p>
    Analyze duplicate files instantly with search,
    paging, filtering, and snapshot browsing.
    Exports made with <code>--analyze</code> also show
    file types, media details, and integrity checks.
  </p>

  <div class="dh-hero-actions">

    <label class="dh-dropzone upload server-only" style="display:none;"
      title="Export folders zipped as <timestamp>.zip">
      <input type="file" class="zipInput" accept=".zip" multiple />
      <i class="ti ti-upload"></i>
      <span>Upload Results (.zip)</span>
    </label>

    <label class="dh-dropzone">
      <input type="file" id="dirInput" webkitdirectory directory multiple />
      <i class="ti ti-folder-open"></i>
      <span>Select Export Directory</span>
    </label>

  </div>

  <div class="dh-actions server-only" style="display:none;margin-top:16px;">

    <button class="dh-btn" onclick="openNotes()">
      <i class="ti ti-notes"></i>
      Notes
    </button>

    <button class="dh-btn" onclick="openLabels()">
      <i class="ti ti-tags"></i>
      Labels
    </button>

  </div>

  <div id="uploadStatus" class="dh-status"></div>

  <div id="resultsList" class="dh-results server-only" style="display:none;"></div>

</div>

<div id="viewer" style="display:none;">

  <div class="dh-topbar">

    <div class="dh-wordmark">
      <i class="ti ti-scan"></i>
      Duplex Hunter
    </div>

    <div class="dh-actions">

      <label class="dh-btn server-only" style="display:none;" title="Upload results (.zip)">
        <input type="file" class="zipInput" accept=".zip" multiple />
        <i class="ti ti-upload"></i>
        Upload
      </label>

      <button class="dh-btn remote-only" style="display:none;"
        onclick="downloadResult()" title="Download these results as .zip">
        <i class="ti ti-download"></i>
        Download
      </button>

      <button class="dh-btn remote-only" style="display:none;"
        onclick="deleteResult()" title="Delete these results from the server">
        <i class="ti ti-trash"></i>
        Delete
      </button>

      <button class="dh-btn server-only" style="display:none;" onclick="openNotes()"
        title="Commented and labeled groups of all results">
        <i class="ti ti-notes"></i>
        Notes
      </button>

      <button class="dh-btn server-only" style="display:none;" onclick="openLabels()">
        <i class="ti ti-tags"></i>
        Labels
      </button>

      <button class="dh-btn" id="backBtn" onclick="resetAll()">
        Change Folder
      </button>

    </div>

  </div>

  <div id="snapsRow" class="dh-snaps"></div>

  <div id="statsRow" class="dh-stats"></div>

  <div class="dh-toolbar">

    <div class="dh-seg">
      <button id="tDupes" class="active" onclick="switchTab('dupes')">Duplicates</button>
      <button id="tUniques" onclick="switchTab('uniques')">Uniques</button>
    </div>

    <div class="dh-search">
      <i class="ti ti-search"></i>
      <input
        type="search"
        id="searchBox"
        placeholder="Search filename, path, extension, hash, type, codec, or comment..."
        oninput="handleSearch(this.value)"
      />
    </div>

    <select id="filterSel" class="dh-filter" onchange="setFilter(this.value)" style="display:none;">
      <option value="all">All files</option>
      <option value="video">Video</option>
      <option value="audio">Audio</option>
      <option value="image">Images</option>
      <option value="other">Other</option>
      <option value="mismatch">Extension mismatch</option>
      <option value="damaged">Damaged or unreadable media</option>
      <option value="gps">GPS location</option>
      <option value="vfr">Variable frame rate</option>
      <option value="nosubs">Videos without subtitles</option>
      <option value="subissues">Subtitle problems</option>
    </select>

    <select id="labelSel" class="dh-filter remote-only" onchange="setLabelFilter(this.value)"
      style="display:none;" title="Filter by label or comment"></select>

    <button class="dh-btn" id="hideSubsBtn" onclick="toggleSubtitleFiles()"
      title="Hide subtitle files, which are also listed with their videos" style="display:none;">
      <i class="ti ti-message-off"></i>
    </button>

    <button class="dh-btn" onclick="expandAll()">
      <i class="ti ti-arrows-maximize"></i>
    </button>

    <button class="dh-btn" onclick="collapseAll()">
      <i class="ti ti-arrows-minimize"></i>
    </button>

  </div>

  <div id="groupsWrap" class="dh-groups"></div>

  <div class="dh-pagination" id="pagination"></div>

  <div id="footerRow" class="dh-footer"></div>

</div>

<div id="notesPage" style="display:none;">

  <div class="dh-topbar">

    <div class="dh-wordmark">
      <i class="ti ti-notes"></i>
      Notes
    </div>

    <div class="dh-actions">

      <button class="dh-btn" onclick="openLabels()">
        <i class="ti ti-tags"></i>
        Labels
      </button>

      <button class="dh-btn" onclick="resetAll()">
        All Results
      </button>

    </div>

  </div>

  <div class="dh-toolbar">

    <div class="dh-seg">
      <button id="nCommented" class="active" onclick="setNotesMode('commented')">With comments</button>
      <button id="nAll" onclick="setNotesMode('all')">All annotated</button>
    </div>

    <select id="notesLabelSel" class="dh-filter" onchange="setNotesLabel(this.value)"></select>

  </div>

  <div id="notesList" class="dh-groups"></div>

</div>

</div>

<div id="labelsModal" class="dh-modal" style="display:none;"
  onclick="if(event.target === this) closeLabels()">

  <div class="dh-modal-box">

    <div class="dh-modal-head">
      <h3>Labels</h3>
      <button class="dh-copy" onclick="closeLabels()" title="Close">
        <i class="ti ti-x"></i>
      </button>
    </div>

    <div id="labelsList"></div>

    <form class="dh-label-row dh-label-form" onsubmit="createLabel(event)">
      <input type="color" id="newLabelColor" title="Label color" />
      <input type="text" id="newLabelName" maxlength="40" placeholder="New label, e.g. Keep" required />
      <button class="dh-btn" type="submit">Add</button>
    </form>

    <div id="labelsError" class="dh-status bad"></div>

  </div>

</div>

<script>

let snaps = [];
let activeSnap = 0;
let activeTab = 'dupes';

let curGroups = [];
let filteredGroups = [];

let currentPage = 1;
const PAGE_SIZE = 25;

let searchTimeout;
let searchQuery = '';
let activeFilter = 'all';
let hideSubtitleFiles = false;

document.getElementById('dirInput')
.addEventListener('change', function(){
  loadDir(this.files);
});

function loadDir(files){

  const arr = Array.from(files);
  const map = {};

  arr.forEach(f => {

    const parts = (f.webkitRelativePath || f.name).split('/');

    if(parts.length < 2) return;

    const snap = parts.length === 2
      ? parts[0]
      : parts[1];

    const base =
      parts[parts.length - 1]
      .replace('.json','');

    if(!['duplicates','uniques','config','analysis'].includes(base))
      return;

    if(!map[snap])
      map[snap] = { name:snap, files:{} };

    map[snap].files[base] = f;

  });

  const names = Object.keys(map);

  if(!names.length){
    alert('No snapshot folders found.');
    return;
  }

  Promise.all(names.map(n => parseSnap(map[n])))
  .then(loaded => {

    snaps = loaded.filter(Boolean);

    showView('viewer');

    renderSnapBtns();
    selectSnap(0);

  });
}

function parseSnap(s){

  const keys = Object.keys(s.files);

  return Promise.all(
    keys.map(k => new Promise(res => {

      const r = new FileReader();

      r.onload = e => {

        try{
          res([k, parseExport(e.target.result)]);
        }catch{
          res([k, null]);
        }

      };

      r.readAsText(s.files[k]);

    }))
  ).then(pairs => {

    const o = { name:s.name };

    pairs.forEach(([k,v]) => o[k]=v);

    indexAnalysis(o);

    return o;

  });
}

function parseExport(text){

  // Hashes are 64-bit integers, which lose precision as JS numbers.
  return JSON.parse(text.replace(/("hash"\s*:\s*)(\d+)/g, '$1"$2"'));
}

function renderSnapBtns(){

  const el = document.getElementById('snapsRow');

  if(snaps.length <= 1){
    el.style.display='none';
    return;
  }

  el.style.display='flex';

  el.innerHTML = snaps.map((s,i)=>`
    <button
      class="dh-snap ${i===activeSnap?'active':''}"
      onclick="selectSnap(${i})"
    >
      ${esc(s.name)}
    </button>
  `).join('');
}

async function selectSnap(i){

  activeSnap=i;
  activeFilter='all';
  labelFilter='all';
  document.getElementById('labelSel').value = 'all';

  const s = snaps[i];

  renderSnapBtns();
  showRemoteActions(!!s.remote);

  if(s.remote && !s.loaded){

    document.getElementById('statsRow').innerHTML = '';
    document.getElementById('pagination').innerHTML = '';
    document.getElementById('footerRow').innerHTML = '';
    document.getElementById('groupsWrap').innerHTML = `
      <div class="dh-empty">
        <i class="ti ti-loader-2" style="font-size:52px;opacity:.7;"></i>
        <h3>Loading ${esc(s.name)}…</h3>
      </div>
    `;

    try{
      await loadRemoteSnap(s);
    }catch(e){
      document.getElementById('groupsWrap').innerHTML = `
        <div class="dh-empty">
          <i class="ti ti-alert-octagon" style="font-size:52px;color:var(--bad);"></i>
          <h3>Could not load ${esc(s.name)}</h3>
          <div style="color:var(--muted)">${esc(e.message)}</div>
        </div>
      `;
      return;
    }

    // Another snapshot was selected while this one was loading.
    if(snaps[activeSnap] !== s) return;
  }

  const sel = document.getElementById('filterSel');
  sel.value = 'all';
  sel.style.display = s.analysisByPath ? '' : 'none';
  document.getElementById('hideSubsBtn').style.display = s.analysisByPath ? '' : 'none';

  renderStats(s);

  switchTab(activeTab);
}

function renderStats(s){

  const dupes = s.duplicates || [];
  const uniques = s.uniques || [];

  const dupFiles =
    dupes.reduce((a,d)=>a+(d.files?.length||0),0);

  const wasted =
    dupes.reduce((a,d)=>a+((d.files?.length||1)-1),0);

  document.getElementById('statsRow').innerHTML = `
    <div class="dh-stat">
      <div class="dh-stat-n">${dupes.length}</div>
      <div class="dh-stat-l">Duplicate Groups</div>
    </div>

    <div class="dh-stat">
      <div class="dh-stat-n">${dupFiles}</div>
      <div class="dh-stat-l">Duplicate Files</div>
    </div>

    <div class="dh-stat">
      <div class="dh-stat-n">${wasted}</div>
      <div class="dh-stat-l">Redundant Copies</div>
    </div>

    <div class="dh-stat">
      <div class="dh-stat-n">${uniques.length}</div>
      <div class="dh-stat-l">Unique Files</div>
    </div>
  ` + analysisStats(s);
}

function analysisStats(s){

  if(!Array.isArray(s.analysis)) return '';

  let media = 0, mismatch = 0, damaged = 0, gps = 0;

  s.analysis.forEach(a => {

    const files = a.files || [];
    const fl = flagsOf(a);

    if(kindOf(a) !== 'other') media += files.length;
    mismatch += files.filter(f => f.extensionMatchesContent === false).length;
    if(fl.damaged || fl.unreadable) damaged += files.length;
    if(fl.gps) gps += files.length;

  });

  const card = (n, label, cls, filter) => `
    <div class="dh-stat${filter ? ' clickable' : ''}"
      ${filter ? `onclick="setFilter('${filter}')" title="Show in the current list"` : ''}>
      <div class="dh-stat-n ${n ? cls : ''}">${n}</div>
      <div class="dh-stat-l">${label}</div>
    </div>
  `;

  const level = s.config?.analysisLevel;

  return (level ? card(level, 'Analysis Level', '', null) : '')
    + card(media, 'Media Files', '', null)
    + card(mismatch, 'Extension Mismatches', 'warn', 'mismatch')
    + card(damaged, 'Damaged or Unreadable Media', 'bad', 'damaged')
    + card(gps, 'Images with GPS Location', 'warn', 'gps');
}

function switchTab(tab){

  activeTab = tab;

  document.getElementById('tDupes')
    .classList.toggle('active',tab==='dupes');

  document.getElementById('tUniques')
    .classList.toggle('active',tab==='uniques');

  const s = snaps[activeSnap];

  curGroups = tab==='dupes'
    ? (s.duplicates || [])
    : (s.uniques || []);

  applyFilters();
}

function formatSize(bytes){

  if(bytes == null) return '';

  const units = ['B','KB','MB','GB','TB'];
  let n = bytes;
  let i = 0;

  while(n >= 1024 && i < units.length - 1){
    n /= 1024;
    i++;
  }

  return `${i === 0 ? n : n.toFixed(1)} ${units[i]}`;
}

const KIND_ICONS = {
  video:'ti-movie',
  audio:'ti-music',
  image:'ti-photo',
  other:'ti-file'
};

// File names and media tags come from the scanned files, so they are escaped.
function esc(v){

  return String(v ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

// Analysis entries are matched to groups by path, as groups with a unique size have no hash.
function indexAnalysis(s){

  if(!Array.isArray(s.analysis)) return;

  s.analysisByPath = new Map();

  s.analysis.forEach(a =>
    (a.files || []).forEach(f => s.analysisByPath.set(f.path, a))
  );
}

function analysisFor(entry){

  const map = snaps[activeSnap]?.analysisByPath;

  return map && entry?.files?.length
    ? map.get(entry.files[0])
    : null;
}

const KINDS = ['video','audio','image'];

// Media FFmpeg could not open has no kind, so it falls back to the MIME type.
function kindOf(a){

  const k = a?.content?.media?.kind;
  const mimeKind = String(a?.content?.type?.mime ?? '').split('/')[0];

  if(KINDS.includes(k)) return k;

  return a?.content?.media?.error && KINDS.includes(mimeKind) ? mimeKind : 'other';
}

function flagsOf(a){

  const m = a?.content?.media;

  return {
    mismatch: (a?.files || []).some(f => f.extensionMatchesContent === false),
    unreadable: !!m?.error,
    damaged: m?.integrity?.complete === false,
    gps: !!m?.image?.gpsPresent,
    // Frames lost in damaged files also make the frame rate irregular.
    vfr: m?.integrity?.complete !== false
      && (m?.packets?.streams || []).some(st => st.frameRateMode === 'variable'),
    ...subtitleFlags(a)
  };
}

function subtitleFlags(a){

  const files = a?.files || [];
  const video = kindOf(a) === 'video';
  const embedded = (a?.content?.media?.streams || []).some(st => st.type === 'subtitle');
  const counts = files.map(f => f.subtitles?.length || 0);

  return {
    // Files analyzed as subtitles carry a back-reference, which is null for orphans.
    subtitleFile: files.length > 0 && files.every(f => 'subtitleFor' in f),
    noSubtitles: video && !embedded && counts.every(n => n === 0),
    subtitlesDiffer: video && files.length > 1 && Math.min(...counts) !== Math.max(...counts),
    subtitleIssues: files.some(f =>
      f.subtitleFor === null || (f.subtitles || []).some(s => s.warnings?.length)
    )
  };
}

function matchesFilter(a, f){

  if(!a) return false;

  const fl = flagsOf(a);

  switch(f){
    case 'mismatch': return fl.mismatch;
    case 'damaged': return fl.damaged || fl.unreadable;
    case 'gps': return fl.gps;
    case 'vfr': return fl.vfr;
    case 'nosubs': return fl.noSubtitles;
    case 'subissues': return fl.subtitleIssues;
    default: return kindOf(a) === f;
  }
}

function searchText(a){

  if(a._search == null){

    const c = a.content || {};
    const m = c.media || {};

    a._search = [
      c.type?.mime,
      c.type?.description,
      m.kind,
      m.container,
      ...(m.streams || []).map(st => st.codec)
    ].filter(Boolean).join(' ').toLowerCase();
  }

  return a._search;
}

function fmtDuration(s){

  if(s == null) return null;

  if(s < 60) return `${s.toFixed(1)} s`;

  const h = Math.floor(s / 3600);
  const m = Math.floor(s % 3600 / 60);
  const sec = String(Math.floor(s % 60)).padStart(2,'0');

  return h
    ? `${h}:${String(m).padStart(2,'0')}:${sec}`
    : `${m}:${sec}`;
}

function fmtBitrate(b){

  if(b == null) return null;

  return b >= 1e6
    ? `${(b / 1e6).toFixed(1)} Mb/s`
    : `${Math.round(b / 1e3)} kb/s`;
}

function fmtDate(iso){

  return iso ? iso.replace('T',' ').replace('Z',' UTC') : null;
}

function yesNo(b){

  return b == null ? null : (b ? 'Yes' : 'No');
}

function chip(text, cls = '', icon = '', title = ''){

  return `<span class="dh-chip ${cls}"${title ? ` title="${esc(title)}"` : ''}>${icon ? `<i class="ti ${icon}"></i>` : ''}${esc(text)}</span>`;
}

function mediaSummary(a){

  const c = a.content || {};
  const m = c.media || {};
  const streams = m.streams || [];

  const v = streams.find(st => st.type === 'video' && !st.attachedPicture);
  const au = streams.find(st => st.type === 'audio');

  const parts = [];

  switch(kindOf(a)){
    case 'video':
      if(v) parts.push(`${v.codec} ${v.width}×${v.height}`);
      if(au) parts.push(au.codec);
      parts.push(fmtDuration(m.duration));
      break;
    case 'audio':
      if(au) parts.push(`${au.codec} ${au.sampleRate / 1000} kHz ${au.channelLayout || ''}`.trim());
      parts.push(fmtDuration(m.duration));
      break;
    case 'image':
      if(v) parts.push(`${v.codec} ${v.width}×${v.height}`);
      break;
    default:
      parts.push(c.type?.mime);
  }

  return parts.filter(Boolean).join(' · ');
}

function groupSummary(a){

  if(!a) return '';

  const k = kindOf(a);
  const fl = flagsOf(a);

  return `
    <div class="dh-summary">
      ${chip(k, '', KIND_ICONS[k])}
      <span>${esc(mediaSummary(a))}</span>
      ${fl.mismatch ? chip('Extension mismatch', 'warn', 'ti-alert-triangle') : ''}
      ${fl.damaged ? chip('Damaged', 'bad', 'ti-alert-octagon', (a.content.media.integrity.issues || []).join('\n')) : ''}
      ${fl.unreadable ? chip('Unreadable', 'bad', 'ti-alert-octagon') : ''}
      ${fl.gps ? chip('GPS location', 'warn', 'ti-map-pin') : ''}
      ${fl.vfr ? chip('VFR', '', 'ti-wave-sine', 'Variable frame rate') : ''}
      ${fl.subtitlesDiffer ? chip('Subtitles differ between copies', 'warn', 'ti-messages', 'Deleting a copy can leave its subtitles without a video') : ''}
    </div>
  `;
}

// rows: [label, value, monospace?]; empty values are skipped.
function kv(rows){

  const items = rows.filter(([,v]) => v != null && v !== '');

  if(!items.length) return '';

  return `<dl class="dh-kv">${items.map(([k,v,mono]) =>
    `<dt>${esc(k)}</dt><dd${mono ? ' class="dh-mono"' : ''}>${esc(v)}</dd>`
  ).join('')}</dl>`;
}

function section(title, body){

  return body
    ? `<div class="dh-sec"><h4>${esc(title)}</h4>${body}</div>`
    : '';
}

function streamLine(st){

  const p = [st.codec, st.profile];

  if(st.type === 'video'){
    p.push(
      `${st.width}×${st.height}`,
      st.frameRate && `${st.frameRate} fps`,
      st.pixelFormat,
      st.bitDepth && `${st.bitDepth}-bit`,
      st.hdr && 'HDR',
      st.rotation && `rotated ${st.rotation}°`,
      st.attachedPicture && 'cover art'
    );
  }

  if(st.type === 'audio'){
    p.push(
      st.sampleRate && `${st.sampleRate} Hz`,
      st.channelLayout,
      st.lossless === true ? 'lossless' : st.lossless === false ? 'lossy' : null
    );
  }

  p.push(
    fmtBitrate(st.bitrate),
    st.language && st.language !== 'und' && st.language,
    st.forced && 'forced',
    st.hearingImpaired && 'SDH'
  );

  return p.filter(Boolean).join(' · ');
}

const LEVEL_LABELS = {
  basic:'Basic (headers)',
  packets:'Packets (no decoding)',
  deep:'Deep (full decode)'
};

function issuesList(issues){

  if(!issues?.length) return '';

  return `<ul class="dh-issues">${issues.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`;
}

function packetLine(st){

  const p = [`${st.packets} packets`, fmtBitrate(st.bitrate)];

  if(st.bitrateMode){
    p.push(`${st.bitrateMode} bitrate${st.peakBitrate ? ` (peak ${fmtBitrate(st.peakBitrate)})` : ''}`);
  }

  if(st.type === 'video'){
    if(st.averageFrameRate){
      p.push(`${st.averageFrameRate} fps ${st.frameRateMode === 'variable' ? 'VFR' : 'CFR'}`);
    }
    p.push(st.keyframeInterval != null
      ? `keyframe every ${st.keyframeInterval} s (max ${st.maxKeyframeInterval} s)`
      : `${st.keyframes} keyframe${st.keyframes === 1 ? '' : 's'}`);
  }

  if(st.corruptPackets) p.push(`${st.corruptPackets} corrupt`);
  if(st.gaps) p.push(`${st.gaps} gaps (${st.gapDuration} s)`);
  if(st.timestampErrors) p.push(`${st.timestampErrors} timestamp errors`);

  return p.filter(Boolean).join(' · ');
}

function renderDetails(a){

  const c = a.content || {};
  const t = c.type || {};
  const g = c.generic || {};
  const m = c.media;

  let html = section('Content', kv([
    ['MIME', t.mime],
    ['Description', t.description],
    ['Encoding', t.encoding],
    ['Extensions', (t.extensions || []).join(', ')],
    ['Entropy', g.entropy != null
      ? `${g.entropy} bits/byte${g.entropySampled ? ' (sampled)' : ''}`
      : null]
  ]));

  if(m?.error){
    html += section('Media', kv([['Error', m.error]]));
  }
  else if(m){

    html += section('Media', kv([
      ['Container', m.containerLongName || m.container],
      ['Duration', fmtDuration(m.duration)],
      ['Bitrate', fmtBitrate(m.bitrate)],
      ['Chapters', m.chapters || null],
      ['Cover art', m.hasCoverArt ? 'Yes' : null],
      ...Object.entries(m.tags || {})
    ]));

    html += section('Streams', kv(
      (m.streams || []).map(st => [`#${st.index} ${st.type}`, streamLine(st)])
    ));

    if(m.image){
      html += section('Image', kv([
        ['Size', `${m.image.width}×${m.image.height} (${m.image.megapixels} MP)`],
        ['Frames', m.image.frameCount],
        ['Animated', yesNo(m.image.animated)],
        ['GPS', yesNo(m.image.gpsPresent)],
        ['dHash', m.image.dhash, true],
        ...Object.entries(m.image.metadata || {})
      ]));
    }

    if(m.integrity){
      const i = m.integrity;
      html += section('Integrity', kv([
        ['Status', i.complete ? 'No problems found' : 'Problems found'],
        ['Checked at', LEVEL_LABELS[i.level] || i.level]
      ]) + issuesList(i.issues));
    }

    if(m.packets){
      const p = m.packets;
      html += section('Packets', kv([
        ['Video frames', p.videoFrames != null && p.expectedVideoFrames != null
          ? `${p.videoFrames} of ${p.expectedVideoFramesEstimated ? '≈' : ''}${p.expectedVideoFrames}`
          : p.videoFrames],
        ['Content end', fmtDuration(p.contentEnd)],
        ['A/V offset', p.audioVideoOffset != null ? `${Math.round(p.audioVideoOffset * 1000)} ms` : null],
        ['Demux error', p.demuxError],
        ...(p.streams || []).map(st => [`#${st.index} ${st.type}`, packetLine(st)])
      ]));
    }

    if(m.frameHashes?.length){
      html += section('Perceptual hashes', kv(
        m.frameHashes.map(h => [`dHash @ ${fmtDuration(h.time)}`, h.dhash, true])
      ));
    }

    if(m.decode){
      const d = m.decode;
      html += section('Decode', kv([
        ['Decode errors', d.decodeErrors],
        ['Corrupt frames', d.corruptFrames],
        ['Video frames', d.videoFrames],
        ['Audio frames', d.audioFrames],
        ['Decoded duration', fmtDuration(d.decodedDuration)],
        ['Missing decoders', (d.missingDecoders || []).join(', ')],
        ['Black frames', d.video
          ? `${d.video.blackFrames} (${(d.video.blackFrameRatio * 100).toFixed(1)}%)`
          : null]
      ]));

      if(d.audio){
        html += section('Audio levels', kv([
          ['Peak', d.audio.peakDb != null ? `${d.audio.peakDb} dBFS` : null],
          ['RMS', d.audio.rmsDb != null ? `${d.audio.rmsDb} dBFS` : null],
          ['Clipped samples', d.audio.clippedSamples],
          ['Silent', d.audio.silent ? 'Yes' : null],
          ['Leading silence', fmtDuration(d.audio.leadingSilence)],
          ['Trailing silence', fmtDuration(d.audio.trailingSilence)]
        ]));
      }
    }
  }

  return `<div class="dh-details">${html}</div>`;
}

function fileMeta(st){

  if(!st) return '';

  const chips = [];

  if(st.extensionMatchesContent === false) chips.push(chip('Extension mismatch', 'warn', 'ti-alert-triangle'));
  if(st.error) chips.push(chip(st.error, 'bad'));
  if(st.mode) chips.push(chip(st.mode, '', 'ti-lock'));
  if(st.owner != null) chips.push(chip(`${st.owner}:${st.group}`, '', 'ti-user'));
  if(st.modified) chips.push(chip(fmtDate(st.modified), '', 'ti-clock'));
  if(st.hardLinks > 1) chips.push(chip(`${st.hardLinks} hard links`, '', 'ti-link'));
  if(st.symlink) chips.push(chip('symlink', '', 'ti-link'));
  if(st.sparse) chips.push(chip('sparse'));
  if(st.xattrs?.length) chips.push(chip(`${st.xattrs.length} xattrs`, '', 'ti-tags'));

  return `<div class="dh-file-meta">${chips.join('')}</div>` + subtitleMeta(st);
}

function baseName(path){

  return String(path).replace(/\\/g,'/').split('/').pop();
}

function subtitleLabel(s){

  return [
    s.language ? s.language.toUpperCase() : 'Unknown language',
    s.forced && 'forced',
    s.sdh && 'SDH',
    s.format !== 'subrip' && s.format
  ].filter(Boolean).join(' ');
}

function subtitleMeta(st){

  const chips = [];
  let warnings = [];

  if(Array.isArray(st.subtitles)){

    if(!st.subtitles.length){
      chips.push(chip('No external subtitles', '', 'ti-message-off'));
    }

    st.subtitles.forEach(s => {
      const w = s.warnings || [];
      const details = [s.path, s.encoding && `Encoding: ${s.encoding}`, s.cues != null && `${s.cues} lines`, ...w];
      chips.push(chip(subtitleLabel(s), w.length ? 'warn' : 'good', 'ti-message', details.filter(Boolean).join('\n')));
      warnings = warnings.concat(w.map(x => `${baseName(s.path)}: ${x}`));
    });
  }

  if('subtitleFor' in st){
    chips.push(st.subtitleFor
      ? chip(`Subtitle of ${baseName(st.subtitleFor)}`, '', 'ti-link', st.subtitleFor)
      : chip('No matching video', 'warn', 'ti-unlink'));
  }

  if(!chips.length) return '';

  return `<div class="dh-file-meta">${chips.join('')}</div>`
    + (warnings.length
      ? `<ul class="dh-issues warn">${warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul>`
      : '');
}

function renderGroups(data){

  const wrap = document.getElementById('groupsWrap');
  const footer = document.getElementById('footerRow');

  if(!data.length){

    wrap.innerHTML = `
      <div class="dh-empty">
        <i class="ti ti-search-off" style="font-size:52px;opacity:.7;"></i>
        <h3>No matches found</h3>
        <div style="color:var(--muted)">
          Try another search term or filter.
        </div>
      </div>
    `;

    document.getElementById('pagination').innerHTML='';
    footer.innerHTML='';

    return;
  }

  const totalPages =
    Math.ceil(data.length / PAGE_SIZE);

  const start =
    (currentPage - 1) * PAGE_SIZE;

  const end = start + PAGE_SIZE;

  const paginated =
    data.slice(start, end);

  const resultCount =
    data.reduce((a,d)=>a+(d.files?.length||0),0);

  footer.innerHTML = `
    <span>${data.length} groups</span>
    <span>${resultCount} files</span>
  `;

  pageEntries = paginated;

  const remote = !!snaps[activeSnap]?.remote;

  wrap.innerHTML = paginated.map((entry,i)=>{

    const hash = entry.hash;
    const size = entry.size;
    const files = entry.files || [];
    const a = analysisFor(entry);
    const icon = a ? KIND_ICONS[kindOf(a)] : 'ti-file';

    const rows = files.map(f=>{

      const norm = f.replace(/\\/g,'/');
      const parts = norm.split('/');

      const name = parts.pop();
      const dir = parts.join('/');

      const stats = a?.files?.find(x => x.path === f);

      return `
        <div class="dh-file">

          <div class="dh-file-icon">
            <i class="ti ${icon}"></i>
          </div>

          <div class="dh-file-info">
            <div class="dh-file-name">${esc(name)}</div>
            <div class="dh-file-path">${esc(dir || '/')}</div>
            ${fileMeta(stats)}
          </div>

          <button class="dh-copy"
            data-path="${esc(f)}"
            onclick="copyPath(this.dataset.path,this)">
            <i class="ti ti-copy"></i>
          </button>

        </div>
      `;

    }).join('');

    return `
      <div class="dh-group">

        <div class="dh-gh" onclick="toggle(${i})">

          <div class="dh-gh-left">

            <span class="dh-badge">
              ${files.length} files
            </span>

            <span class="dh-size">
              ${formatSize(size)}
            </span>

            <div class="dh-gh-main">

              <span class="dh-hash">
                ${hash != null ? hash : 'unique size — not hashed'}
              </span>

              ${groupSummary(a)}

              <div class="dh-labels" id="gl-${i}">${remote ? noteChips(annotationFor(entry)) : ''}</div>

            </div>

          </div>

          <i class="ti ti-chevron-down dh-chev"
             id="chev-${i}"></i>

        </div>

        <div class="dh-gfiles" id="gf-${i}">
          ${remote ? notesSection(i) : ''}
          ${a ? renderDetails(a) : ''}
          ${rows}
        </div>

      </div>
    `;

  }).join('');

  renderPagination(totalPages);
}

function renderPagination(totalPages){

  const el = document.getElementById('pagination');

  if(totalPages <= 1){
    el.innerHTML='';
    return;
  }

  el.innerHTML = `
    <button class="dh-page-btn"
      onclick="prevPage()"
      ${currentPage===1?'disabled':''}>
      Previous
    </button>

    <div class="dh-page-info">
      Page ${currentPage} of ${totalPages}
    </div>

    <button class="dh-page-btn"
      onclick="nextPage()"
      ${currentPage===totalPages?'disabled':''}>
      Next
    </button>
  `;
}

function nextPage(){

  const totalPages =
    Math.ceil(filteredGroups.length / PAGE_SIZE);

  if(currentPage < totalPages){

    currentPage++;

    renderGroups(filteredGroups);

    window.scrollTo({
      top:0,
      behavior:'smooth'
    });

  }
}

function prevPage(){

  if(currentPage > 1){

    currentPage--;

    renderGroups(filteredGroups);

    window.scrollTo({
      top:0,
      behavior:'smooth'
    });

  }
}

function toggle(i){

  document.getElementById(`gf-${i}`)
    .classList.toggle('open');

  document.getElementById(`chev-${i}`)
    .classList.toggle('open');
}

function expandAll(){

  document.querySelectorAll('.dh-gfiles')
    .forEach(e=>e.classList.add('open'));

  document.querySelectorAll('.dh-chev')
    .forEach(e=>e.classList.add('open'));
}

function collapseAll(){

  document.querySelectorAll('.dh-gfiles')
    .forEach(e=>e.classList.remove('open'));

  document.querySelectorAll('.dh-chev')
    .forEach(e=>e.classList.remove('open'));
}

function handleSearch(v){

  clearTimeout(searchTimeout);

  searchTimeout = setTimeout(()=>{
    doFilter(v);
  },150);
}

function doFilter(q){

  searchQuery = q.trim().toLowerCase();

  applyFilters();
}

function toggleSubtitleFiles(){

  hideSubtitleFiles = !hideSubtitleFiles;

  document.getElementById('hideSubsBtn').classList.toggle('active', hideSubtitleFiles);

  applyFilters();
}

function setFilter(f){

  activeFilter = f;

  document.getElementById('filterSel').value = f;

  applyFilters();
}

function applyFilters(){

  const query = searchQuery;

  filteredGroups = curGroups.filter(entry => {

    const a = analysisFor(entry);

    if(activeFilter !== 'all' && !matchesFilter(a, activeFilter))
      return false;

    if(hideSubtitleFiles && a && flagsOf(a).subtitleFile)
      return false;

    const ann = annotationFor(entry);

    if(labelFilter !== 'all' && !matchesLabelFilter(ann, labelFilter))
      return false;

    if(!query)
      return true;

    if(ann?.comment?.toLowerCase().includes(query))
      return true;

    const hash =
      String(entry?.hash ?? '')
      .toLowerCase();

    const files =
      Array.isArray(entry?.files)
      ? entry.files
      : [];

    if(hash.includes(query))
      return true;

    if(a && searchText(a).includes(query))
      return true;

    return files.some(file =>
      String(file).toLowerCase().includes(query)
    );

  });

  currentPage = 1;

  renderGroups(filteredGroups);
}

const VIEWS = { hero:'flex', viewer:'block', notesPage:'block' };

function showView(view){

  Object.entries(VIEWS).forEach(([id, display]) =>
    document.getElementById(id).style.display = id === view ? display : 'none'
  );
}

function copyPath(path, btn){

  navigator.clipboard.writeText(path)
  .then(()=>{

    const orig = btn.innerHTML;

    btn.innerHTML='<i class="ti ti-check"></i>';

    setTimeout(()=>{
      btn.innerHTML=orig;
    },1200);

  });
}

function resetAll(){

  snaps=[];
  activeSnap=0;

  showView('hero');

  document.getElementById('dirInput')
    .value='';

  if(serverMode) refreshResults();
}

// ---------------------------------------------------------------------------
// Server mode: when the page is served by the Duplex Hunter backend, results
// are uploaded to and loaded from its API instead of a local folder.
// ---------------------------------------------------------------------------

let serverMode = false;
let remoteResults = [];

async function api(path, opts){

  const r = await fetch(path, opts);

  if(!r.ok){
    let msg = `${r.status} ${r.statusText}`;
    try{ msg = (await r.json()).detail || msg; }catch{}
    const err = new Error(msg);
    err.status = r.status;
    throw err;
  }

  return r;
}

function resultUrl(name){

  return `api/results/${encodeURIComponent(name)}`;
}

async function initServerMode(){

  if(location.protocol === 'file:') return;

  try{
    await api('api/health');
  }catch{
    return;
  }

  serverMode = true;

  document.querySelectorAll('.server-only')
    .forEach(e => e.style.display = '');

  document.getElementById('backBtn').textContent = 'All Results';

  document.addEventListener('keydown', e => {
    if(e.key === 'Escape') closeLabels();
  });

  document.querySelectorAll('.zipInput').forEach(input =>
    input.addEventListener('change', function(){
      uploadZips(this.files).finally(() => this.value = '');
    })
  );

  // Zip files can also be dropped anywhere on the page.
  document.addEventListener('dragover', e => {
    e.preventDefault();
    document.body.classList.add('dh-dragging');
  });

  document.addEventListener('dragleave', e => {
    if(!e.relatedTarget) document.body.classList.remove('dh-dragging');
  });

  document.addEventListener('drop', e => {
    e.preventDefault();
    document.body.classList.remove('dh-dragging');
    uploadZips(e.dataTransfer.files);
  });

  await Promise.all([refreshResults(), loadLabels()]);
}

function showRemoteActions(show){

  document.querySelectorAll('.remote-only')
    .forEach(e => e.style.display = show ? '' : 'none');
}

function setStatus(text, bad = false){

  const el = document.getElementById('uploadStatus');

  el.textContent = text;
  el.classList.toggle('bad', bad);
}

async function refreshResults(){

  try{
    remoteResults = await (await api('api/results')).json();
  }catch(e){
    setStatus(`Could not load stored results: ${e.message}`, true);
    return;
  }

  renderResultsList();
}

function renderResultsList(){

  const el = document.getElementById('resultsList');

  if(!remoteResults.length){
    el.innerHTML = `
      <div class="dh-empty" style="padding:2rem;">
        <div style="color:var(--muted)">
          No results stored yet. Zip an export folder as
          <code>&lt;timestamp&gt;.zip</code> and upload it.
        </div>
      </div>
    `;
    return;
  }

  el.innerHTML = remoteResults.map((r,i) => {

    const st = r.stats || {};
    const level = r.config?.analysisLevel;

    return `
      <button class="dh-result" onclick="openResult(${i})">

        <div class="dh-file-icon">
          <i class="ti ti-database"></i>
        </div>

        <div class="dh-result-info">
          <div class="dh-result-name">${esc(r.name)}</div>
          <div class="dh-result-paths">${esc((r.config?.paths || []).join(' · '))}</div>
          <div class="dh-file-meta">
            ${chip(`${st.duplicateGroups} duplicate groups`, '', 'ti-copy')}
            ${chip(`${st.redundantCopies} redundant copies`, st.redundantCopies ? 'warn' : '', 'ti-files')}
            ${chip(`${st.uniqueFiles} unique`, '', 'ti-file')}
            ${level && level !== 'none' ? chip(`analysis: ${level}`, 'good', 'ti-microscope') : ''}
            ${chip(formatSize(r.sizeBytes), '', 'ti-database')}
            ${r.commentedGroups ? chip(`${r.commentedGroups} commented`, 'good', 'ti-message') : ''}
            ${r.annotatedGroups > r.commentedGroups ? chip(`${r.annotatedGroups - r.commentedGroups} labeled`, '', 'ti-tag') : ''}
          </div>
        </div>

        <i class="ti ti-chevron-right"></i>

      </button>
    `;

  }).join('');
}

function remoteSnaps(){

  // Results that were already downloaded are kept, unless they were replaced.
  const loaded = new Map(
    snaps.filter(s => s.remote).map(s => [s.name, s])
  );

  return remoteResults.map(r => {
    const old = loaded.get(r.name);
    return old && old.meta.uploadedAt === r.uploadedAt
      ? old
      : { name:r.name, remote:true, meta:r };
  });
}

function openResult(i){

  snaps = remoteSnaps();

  setStatus('');

  showView('viewer');

  return selectSnap(i);
}

async function loadRemoteSnap(s){

  const files = Promise.all(s.meta.files.map(async k => {
    const r = await api(`${resultUrl(s.name)}/files/${k}`);
    s[k] = parseExport(await r.text());
  }));

  const notes = api(`${resultUrl(s.name)}/annotations`)
    .then(r => r.json())
    .then(list => {
      s.annotations = new Map(list.map(a => [annKey(a.section, a.key), a]));
    });

  await Promise.all([files, notes]);

  indexAnalysis(s);

  s.loaded = true;
}

async function uploadOne(file, overwrite){

  const body = new FormData();
  body.append('file', file);

  const r = await api(`api/results?overwrite=${overwrite}`, { method:'POST', body });

  return r.json();
}

async function uploadZips(files){

  const zips = Array.from(files || [])
    .filter(f => f.name.toLowerCase().endsWith('.zip'));

  if(!zips.length) return;

  const errors = [];
  let lastName = null;

  for(const f of zips){

    setStatus(`Uploading ${f.name}…`);

    try{
      lastName = (await uploadOne(f, false)).name;
    }catch(e){
      if(e.status === 409 && confirm(`${f.name} was already uploaded. Replace it?`)){
        try{
          lastName = (await uploadOne(f, true)).name;
        }catch(e2){
          errors.push(`${f.name}: ${e2.message}`);
        }
      }else if(e.status !== 409){
        errors.push(`${f.name}: ${e.message}`);
      }
    }
  }

  await refreshResults();

  if(errors.length){
    setStatus(errors.join('\n'), true);
    alert(errors.join('\n'));
  }else{
    setStatus(lastName ? `Uploaded ${zips.length} file${zips.length === 1 ? '' : 's'}.` : '');
  }

  // Shows the uploaded result, or refreshes the switcher if already browsing.
  const inViewer = document.getElementById('viewer').style.display !== 'none';
  const idx = remoteResults.findIndex(r => r.name === lastName);

  if(idx >= 0) openResult(idx);
  else if(inViewer && snaps[activeSnap]?.remote){
    const cur = snaps[activeSnap].name;
    snaps = remoteSnaps();
    activeSnap = Math.max(0, snaps.findIndex(s => s.name === cur));
    renderSnapBtns();
  }
}

function downloadResult(){

  const s = snaps[activeSnap];

  if(!s?.remote) return;

  const a = document.createElement('a');
  a.href = `${resultUrl(s.name)}/download`;
  a.download = `${s.name}.zip`;
  a.click();
}

async function deleteResult(){

  const s = snaps[activeSnap];

  if(!s?.remote || !confirm(`Delete ${s.name} from the server? This cannot be undone.`)) return;

  try{
    await api(resultUrl(s.name), { method:'DELETE' });
  }catch(e){
    alert(`Could not delete ${s.name}: ${e.message}`);
    return;
  }

  await refreshResults();

  snaps = remoteSnaps();

  if(!snaps.length){
    resetAll();
    return;
  }

  selectSnap(Math.min(activeSnap, snaps.length - 1));
}

// ---------------------------------------------------------------------------
// Notes: groups of a stored result can have a comment and labels. Groups are
// identified by their hash, or their first path when they were not hashed.
// ---------------------------------------------------------------------------

let labels = [];
let labelById = new Map();
let labelFilter = 'all';
let pageEntries = [];
let notesMode = 'commented';
let notesLabel = 'all';

const LABEL_COLORS = ['#6ea8ff','#34d399','#f87171','#fbbf24','#a78bfa','#f472b6','#22d3ee','#fb923c'];

function sectionOf(tab){

  return tab === 'dupes' ? 'duplicates' : 'uniques';
}

function groupKey(entry){

  return entry.hash != null ? String(entry.hash) : String(entry.files?.[0] ?? '');
}

function annKey(section, key){

  return `${section}\n${key}`;
}

function annotationFor(entry){

  return snaps[activeSnap]?.annotations?.get(annKey(sectionOf(activeTab), groupKey(entry)));
}

function matchesLabelFilter(ann, f){

  switch(f){
    case 'labeled': return !!ann?.labels?.length;
    case 'unlabeled': return !ann?.labels?.length;
    case 'commented': return !!ann?.comment;
    default: return !!ann?.labels?.includes(f);
  }
}

function labelChip(l){

  return `<span class="dh-label" style="--c:${esc(l.color)}">${esc(l.name)}</span>`;
}

function noteChips(ann){

  if(!ann) return '';

  return (ann.labels || [])
    .map(id => labelById.get(id))
    .filter(Boolean)
    .map(labelChip)
    .join('')
    + (ann.comment ? chip('Comment', 'good', 'ti-message', ann.comment) : '');
}

function labelPicker(ann, i){

  if(!labels.length){
    return `<span style="color:var(--muted);font-size:13px;">
      No labels yet. <button class="dh-link" onclick="openLabels()">Create one</button>
    </span>`;
  }

  const on = new Set(ann?.labels || []);

  return labels.map(l => `
    <button class="dh-label ${on.has(l.id) ? 'on' : ''}" style="--c:${esc(l.color)}"
      onclick="toggleLabel(${i}, '${l.id}')"
      title="${on.has(l.id) ? 'Remove' : 'Add'} label">
      ${esc(l.name)}
    </button>
  `).join('');
}

function notesSection(i){

  const ann = annotationFor(pageEntries[i]);

  return `
    <div class="dh-notes">
      <h4>Notes</h4>
      <div class="dh-labels" id="lp-${i}">${labelPicker(ann, i)}</div>
      <textarea id="nc-${i}" maxlength="10000" placeholder="Add a comment…"
        onkeydown="if((event.ctrlKey || event.metaKey) && event.key === 'Enter') saveComment(${i})"
      >${esc(ann?.comment)}</textarea>
      <div class="dh-notes-actions">
        <span id="ns-${i}"></span>
        <button class="dh-btn" onclick="saveComment(${i})" title="Ctrl+Enter">
          Save comment
        </button>
      </div>
    </div>
  `;
}

async function saveAnnotation(i, changes){

  const entry = pageEntries[i];
  const s = snaps[activeSnap];
  const section = sectionOf(activeTab);
  const key = groupKey(entry);
  const ann = s.annotations.get(annKey(section, key));

  const body = {
    section,
    key,
    comment: ann?.comment || '',
    labels: ann?.labels || [],
    ...changes,
    files: entry.files || [],
    size: entry.size ?? null,
    hash: entry.hash != null ? String(entry.hash) : null
  };

  const saved = await (await api(`${resultUrl(s.name)}/annotations`, {
    method:'PUT',
    headers:{ 'Content-Type':'application/json' },
    body:JSON.stringify(body)
  })).json();

  if(saved.comment || saved.labels.length) s.annotations.set(annKey(section, key), saved);
  else s.annotations.delete(annKey(section, key));

  // Only this group is redrawn, so other expanded groups stay open.
  document.getElementById(`gl-${i}`).innerHTML = noteChips(saved);
  document.getElementById(`lp-${i}`).innerHTML = labelPicker(saved, i);

  return saved;
}

async function toggleLabel(i, id){

  const current = annotationFor(pageEntries[i])?.labels || [];
  const next = current.includes(id)
    ? current.filter(x => x !== id)
    : [...current, id];

  try{
    await saveAnnotation(i, { labels:next });
  }catch(e){
    alert(`Could not update labels: ${e.message}`);
  }
}

async function saveComment(i){

  const status = document.getElementById(`ns-${i}`);
  const text = document.getElementById(`nc-${i}`).value;

  status.textContent = 'Saving…';

  try{
    const saved = await saveAnnotation(i, { comment:text });
    document.getElementById(`nc-${i}`).value = saved.comment;
    status.textContent = 'Saved';
    setTimeout(() => { if(status.textContent === 'Saved') status.textContent = ''; }, 1500);
  }catch(e){
    status.textContent = `Not saved: ${e.message}`;
  }
}

function setLabelFilter(f){

  labelFilter = f;

  document.getElementById('labelSel').value = f;

  applyFilters();
}

function labelOptions(extra, current){

  const opts = extra.concat(labels.map(l => [l.id, `Label: ${l.name}`]));
  const value = opts.some(([v]) => v === current) ? current : 'all';

  return {
    value,
    html: opts.map(([v, text]) => `<option value="${esc(v)}">${esc(text)}</option>`).join('')
  };
}

function renderLabelFilters(){

  const sel = document.getElementById('labelSel');
  const view = labelOptions([
    ['all','All groups'],
    ['commented','With comments'],
    ['labeled','Any label'],
    ['unlabeled','No label']
  ], labelFilter);

  sel.innerHTML = view.html;
  sel.value = labelFilter = view.value;

  const notesSel = document.getElementById('notesLabelSel');
  const notes = labelOptions([['all','All labels']], notesLabel);

  notesSel.innerHTML = notes.html;
  notesSel.value = notesLabel = notes.value;
}

async function loadLabels(){

  try{
    labels = await (await api('api/labels')).json();
  }catch(e){
    labels = [];
  }

  labelById = new Map(labels.map(l => [l.id, l]));

  renderLabelFilters();
}

// Redraws whatever shows labels after they were changed.
function refreshLabelViews(){

  renderLabelFilters();

  if(document.getElementById('viewer').style.display !== 'none' && snaps[activeSnap]?.loaded){
    const open = new Set(
      [...document.querySelectorAll('.dh-gfiles.open')].map(e => e.id)
    );
    renderGroups(filteredGroups);
    open.forEach(id => {
      document.getElementById(id)?.classList.add('open');
      document.getElementById(id.replace('gf-','chev-'))?.classList.add('open');
    });
  }

  if(document.getElementById('notesPage').style.display !== 'none') renderNotes();
}

function renderLabelsList(){

  const el = document.getElementById('labelsList');

  if(!labels.length){
    el.innerHTML = `<div style="color:var(--muted);font-size:14px;">
      No labels yet. Labels can be assigned to groups and used as filters.
    </div>`;
    return;
  }

  el.innerHTML = labels.map(l => `
    <div class="dh-label-row">
      <input type="color" value="${esc(l.color)}" title="Label color"
        onchange="updateLabel('${l.id}', { color:this.value })" />
      <input type="text" value="${esc(l.name)}" maxlength="40" title="Rename"
        onchange="updateLabel('${l.id}', { name:this.value }, this)" />
      <button class="dh-copy" onclick="deleteLabel('${l.id}')" title="Delete label">
        <i class="ti ti-trash"></i>
      </button>
    </div>
  `).join('');
}

function openLabels(){

  document.getElementById('labelsError').textContent = '';
  document.getElementById('newLabelColor').value = LABEL_COLORS[labels.length % LABEL_COLORS.length];

  renderLabelsList();

  document.getElementById('labelsModal').style.display = 'flex';
  document.getElementById('newLabelName').focus();
}

function closeLabels(){

  document.getElementById('labelsModal').style.display = 'none';
}

async function labelRequest(path, opts){

  document.getElementById('labelsError').textContent = '';

  try{
    await api(path, opts);
    return true;
  }catch(e){
    document.getElementById('labelsError').textContent = e.message;
    return false;
  }
}

async function createLabel(e){

  e.preventDefault();

  const name = document.getElementById('newLabelName');
  const color = document.getElementById('newLabelColor');

  const ok = await labelRequest('api/labels', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body:JSON.stringify({ name:name.value.trim(), color:color.value })
  });

  if(!ok) return;

  name.value = '';

  await loadLabels();

  color.value = LABEL_COLORS[labels.length % LABEL_COLORS.length];

  renderLabelsList();
  refreshLabelViews();
}

async function updateLabel(id, changes, input){

  if(changes.name !== undefined && !changes.name.trim()){
    input.value = labelById.get(id)?.name ?? '';
    return;
  }

  const ok = await labelRequest(`api/labels/${id}`, {
    method:'PATCH',
    headers:{ 'Content-Type':'application/json' },
    body:JSON.stringify(changes)
  });

  if(!ok && input) input.value = labelById.get(id)?.name ?? '';

  await loadLabels();

  refreshLabelViews();
}

async function deleteLabel(id){

  const l = labelById.get(id);

  if(!confirm(`Delete the label "${l?.name}"? It is removed from all groups.`)) return;

  if(!await labelRequest(`api/labels/${id}`, { method:'DELETE' })) return;

  // Loaded results drop the label the same way the server does.
  snaps.forEach(s => s.annotations?.forEach((a, k) => {
    a.labels = a.labels.filter(x => x !== id);
    if(!a.labels.length && !a.comment) s.annotations.delete(k);
  }));

  await loadLabels();

  renderLabelsList();
  refreshLabelViews();
}

function openNotes(){

  setStatus('');

  showView('notesPage');

  renderNotes();
}

function setNotesMode(mode){

  notesMode = mode;

  document.getElementById('nCommented').classList.toggle('active', mode === 'commented');
  document.getElementById('nAll').classList.toggle('active', mode === 'all');

  renderNotes();
}

function setNotesLabel(id){

  notesLabel = id;

  renderNotes();
}

let notesList = [];

async function renderNotes(){

  const el = document.getElementById('notesList');
  const params = new URLSearchParams();

  if(notesMode === 'commented') params.set('commented', 'true');
  if(notesLabel !== 'all') params.set('label', notesLabel);

  try{
    notesList = await (await api(`api/annotations?${params}`)).json();
  }catch(e){
    el.innerHTML = `<div class="dh-empty"><h3>Could not load notes</h3>
      <div style="color:var(--muted)">${esc(e.message)}</div></div>`;
    return;
  }

  if(!notesList.length){
    el.innerHTML = `
      <div class="dh-empty">
        <i class="ti ti-notes-off" style="font-size:52px;opacity:.7;"></i>
        <h3>No notes found</h3>
        <div style="color:var(--muted)">
          Open a result and expand a group to add a comment or labels.
        </div>
      </div>
    `;
    return;
  }

  el.innerHTML = notesList.map((a,i) => {

    const files = a.files || [];
    const first = files[0] ?? a.key;
    const parts = String(first).replace(/\\/g,'/').split('/');
    const name = parts.pop();

    return `
      <div class="dh-group">
        <div class="dh-note-card" onclick="openAnnotation(${i})" title="Show in result">

          <div class="dh-note-head">
            ${chip(a.result, '', 'ti-database')}
            ${chip(a.section === 'duplicates' ? 'Duplicates' : 'Uniques', '', a.section === 'duplicates' ? 'ti-copy' : 'ti-file')}
            ${a.size != null ? `<span class="dh-size">${formatSize(a.size)}</span>` : ''}
            <div class="dh-labels">${(a.labels || []).map(id => labelById.get(id)).filter(Boolean).map(labelChip).join('')}</div>
          </div>

          <div class="dh-file-info">
            <div class="dh-file-name">${esc(name)}${files.length > 1 ? ` <span style="color:var(--muted);font-weight:400;">+${files.length - 1} more</span>` : ''}</div>
            <div class="dh-file-path">${esc(parts.join('/') || '/')}</div>
          </div>

          ${a.comment ? `<div class="dh-comment">${esc(a.comment)}</div>` : ''}

        </div>
      </div>
    `;

  }).join('');
}

async function openAnnotation(i){

  const a = notesList[i];
  let idx = remoteResults.findIndex(r => r.name === a.result);

  if(idx < 0){
    await refreshResults();
    idx = remoteResults.findIndex(r => r.name === a.result);
  }

  if(idx < 0){
    alert(`${a.result} is no longer stored.`);
    return;
  }

  await openResult(idx);

  if(!snaps[activeSnap]?.loaded) return;

  focusGroup(a.section, a.key);
}

// Shows a group with all filters cleared, expanded and scrolled into view.
function focusGroup(section, key){

  activeFilter = 'all';
  labelFilter = 'all';
  searchQuery = '';
  hideSubtitleFiles = false;

  document.getElementById('filterSel').value = 'all';
  document.getElementById('labelSel').value = 'all';
  document.getElementById('searchBox').value = '';
  document.getElementById('hideSubsBtn').classList.remove('active');

  switchTab(section === 'duplicates' ? 'dupes' : 'uniques');

  const idx = filteredGroups.findIndex(e => groupKey(e) === key);

  if(idx < 0){
    alert('This group is no longer part of the result.');
    return;
  }

  currentPage = Math.floor(idx / PAGE_SIZE) + 1;

  renderGroups(filteredGroups);

  const i = idx % PAGE_SIZE;
  const group = document.getElementById(`gf-${i}`).closest('.dh-group');

  toggle(i);

  group.classList.add('focus');
  group.scrollIntoView({ behavior:'smooth', block:'start' });
}

initServerMode();

</script>
